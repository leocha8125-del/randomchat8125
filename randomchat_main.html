<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Welcome to my RandomChat World/title>
    <style>
        /* 기본 레이아웃 설정 */
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            background-color: #f5f5f5;
        }
        
        .container { 
            width: 90%; 
            max-width: 900px; /* 전체 너비를 키움 */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 채팅 표시 화면 (더 크게 수정) */
        #chat-display {
            width: 100%;
            height: 600px; /* 높이를 대폭 키움 */
            border: 4px solid black;
            background-color: white;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            font-size: 1.2rem;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        }

        /* 입력창 영역 */
        .input-area {
            display: flex;
            gap: 15px;
            height: 60px;
        }

        /* 입력 박스 */
        #message-input {
            flex-grow: 1;
            padding: 0 20px;
            border: 3px solid black;
            font-size: 1.1rem;
            outline: none;
        }
        #message-input:focus {
            background-color: #fffef0;
            border-color: #333;
        }

        /* 입체감 있는 입력 버튼 */
        #send-btn {
            width: 150px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 3px solid black;
            background-color: #eeeeee;
            cursor: pointer;
            position: relative;
            top: 0;
            left: 0;
            /* 버튼 그림자로 입체감 표현 */
            box-shadow: 4px 4px 0px black;
            transition: all 0.1s;
        }

        /* 마우스를 올렸을 때 */
        #send-btn:hover {
            background-color: #ddd;
        }

        /* 버튼이 실제로 눌리는 효과 (클릭 시 혹은 스크립트로 동작) */
        #send-btn:active, #send-btn.btn-active {
            box-shadow: 0px 0px 0px black;
            top: 4px;
            left: 4px;
            background-color: #bbb;
        }

        /* 채팅 메시지 스타일 */
        .msg {
            margin-bottom: 10px;
            padding: 5px;
            border-bottom: 1px dotted #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 채팅 내용 표시 창 -->
    <div id="chat-display"></div>

    <!-- 하단 입력 영역 -->
    <div class="input-area">
        <input type="text" id="message-input" placeholder="메세지 내용을 입력하세요..." autofocus>
        <button id="send-btn">Press Input</button>
    </div>
</div>

<script>
    const sendBtn = document.getElementById('send-btn');
    const input = document.getElementById('message-input');
    const display = document.getElementById('chat-display');

    // 메시지 전송 함수
    function sendMessage() {
        const text = input.value.trim();
        if (text !== "") {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'msg';
            messageDiv.textContent = "이름 : " + text;
            
            display.appendChild(messageDiv);
            input.value = "";
            display.scrollTop = display.scrollHeight;
        }
    }

    // 버튼 클릭 시 실행
    sendBtn.addEventListener('click', sendMessage);

    // 엔터키 입력 시 버튼이 눌리는 효과와 함께 전송
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            // 버튼이 눌리는 시각적 효과 추가
            sendBtn.classList.add('btn-active');
            
            // 전송
            sendMessage();

            // 0.1초 후에 버튼 눌림 효과 제거
            setTimeout(() => {
                sendBtn.classList.remove('btn-active');
            }, 100);
        }
    });
</script>

</body>
</html>
