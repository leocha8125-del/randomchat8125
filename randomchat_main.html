<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern random chat world</title>
    <style>
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container { 
            width: 95%; 
            max-width: 900px; 
            height: 85vh;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #eef0f2;
        }

        .chat-header {
            padding: 24px;
            background: #fff;
            border-bottom: 1px solid #f1f3f5;
            font-weight: 800;
            font-size: 1.4rem;
            text-align: center;
            color: #1a202c;
        }

        #chat-display {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 75%;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.6;
            background-color: #f1f3f5;
            color: #2d3748;
            align-self: flex-start;
        }

        .msg.me {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
        }

        .input-area {
            padding: 24px;
            background: #fff;
            border-top: 1px solid #f1f3f5;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #message-input {
            flex-grow: 1;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            border-color: #007bff;
        }

        /* 입체적 음영 버튼 스타일 */
        #send-btn {
            padding: 0 32px;
            height: 54px;
            background-color: #007bff;
            color: white;
            border: 2px solid #0056b3;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            position: relative;
            top: 0;
            /* 하단 음영으로 입체감 표현 */
            box-shadow: 0 4px 0 #004a99;
            transition: all 0.05s;
            white-space: nowrap;
        }

        /* 마우스를 올렸을 때 */
        #send-btn:hover {
            background-color: #0069d9;
        }

        /* 버튼이 눌리는 효과 (클릭 시 혹은 클래스 추가 시) */
        #send-btn:active, #send-btn.is-active {
            top: 4px;
            box-shadow: 0 0 0 #004a99;
            background-color: #0056b3;
        }

        #chat-display::-webkit-scrollbar {
            width: 5px;
        }
        #chat-display::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="chat-header">Modern random chat world</div>
    
    <div id="chat-display">
        <div class="msg"><b>System:</b> 환영합니다! 입체적인 전송 버튼을 확인해보세요.</div>
    </div>

    <div class="input-area">
        <input type="text" id="message-input" placeholder="메시지를 입력하세요..." autocomplete="off">
        <button id="send-btn">전송</button>
    </div>
</div>

<script>
    const sendBtn = document.getElementById('send-btn');
    const input = document.getElementById('message-input');
    const display = document.getElementById('chat-display');

    function sendMessage() {
        const text = input.value.trim();
        if (text !== "") {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'msg me';
            messageDiv.textContent = text;
            
            display.appendChild(messageDiv);
            input.value = "";
            
            display.scrollTo({
                top: display.scrollHeight,
                behavior: 'smooth'
            });
        }
    }

    // 마우스 클릭 전송
    sendBtn.addEventListener('click', sendMessage);

    // 키보드 엔터 전송 (버튼 눌림 효과 포함)
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            // 버튼 눌림 효과 클래스 추가
            sendBtn.classList.add('is-active');
            
            sendMessage();

            // 잠깐 뒤에 효과 제거
            setTimeout(() => {
                sendBtn.classList.remove('is-active');
            }, 100);
        }
    });
</script>

</body>
</html>
